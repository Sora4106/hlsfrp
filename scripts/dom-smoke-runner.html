<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>HLS browser smoke test</title>
    <style>
      body { margin: 0; font-family: sans-serif; }
      iframe { width: 390px; height: 844px; border: 0; }
      pre { white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <iframe id="site" title="Test site" src="../?skipWelcome=1#/home"></iframe>
    <pre id="result" data-status="running">Running…</pre>
    <script>
      const frame = document.querySelector("#site");
      const result = document.querySelector("#result");
      const delay = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
      const assert = (condition, message) => {
        if (!condition) throw new Error(message);
      };
      const waitFor = async (predicate, message, timeout = 3500) => {
        const deadline = Date.now() + timeout;
        while (Date.now() < deadline) {
          if (predicate()) return;
          await delay(50);
        }
        throw new Error(message);
      };
      const page = () => frame.contentDocument;
      const view = () => frame.contentWindow;
      const setRoute = async (route, selector) => {
        view().location.hash = route;
        await waitFor(() => page().querySelector(selector), `Route did not render: ${route}`);
        await delay(100);
      };

      frame.addEventListener("load", async function run() {
        if (frame.dataset.running) return;
        frame.dataset.running = "true";
        try {
          await waitFor(() => page().querySelector("#main-content h1"), "Home did not render");
          assert(view().innerWidth === 390, "Mobile viewport width is not 390px");
          assert(page().documentElement.scrollWidth <= 390, "Home page has horizontal overflow");
          const footerLogo = page().querySelector(".footer-brand img");
          await waitFor(() => footerLogo.complete && footerLogo.naturalWidth > 0, "Footer logo did not load");
          const footerLogoBox = footerLogo.getBoundingClientRect();
          assert(Math.abs((footerLogoBox.width / footerLogoBox.height) - (259 / 154)) < 0.02, "Footer logo aspect ratio is distorted");

          page().querySelector('[data-language="zh-CN"]').click();
          await waitFor(() => page().documentElement.lang === "zh-Hans", "Simplified Chinese did not activate");
          assert(page().body.textContent.includes("首页"), "Simplified Chinese copy did not render");

          page().querySelector('[data-language="th"]').click();
          await waitFor(() => page().documentElement.lang === "th", "Thai did not activate");
          assert(page().body.textContent.includes("หน้าหลัก"), "Thai copy did not render");

          page().querySelector('[data-language="en"]').click();
          await setRoute("#/product/feed-system", ".product-detail-actions");
          const actions = [...page().querySelectorAll(".product-detail-actions a, .product-detail-actions button")]
            .map((element) => element.textContent.trim());
          assert(JSON.stringify(actions) === JSON.stringify(["Start a project", "Product results", "Specifications & dimensions"]), `Product actions are incomplete: ${actions.join(" | ")}`);
          assert(page().querySelector("#product-results"), "Project results anchor is missing");
          assert(page().querySelector("#product-specifications"), "Specifications anchor is missing");
          assert(page().documentElement.scrollWidth <= 390, "Product page has horizontal overflow");
          const productResults = page().querySelector("#product-results");
          productResults.scrollIntoView = () => { productResults.dataset.testScrolled = "true"; };
          page().querySelector('[data-scroll-target="product-results"]').click();
          assert(productResults.dataset.testScrolled === "true", "Product results button did not request its target section");

          page().querySelector(".gallery-trigger").click();
          await waitFor(() => page().querySelector("#lightbox").open, "Image enlargement did not open");
          assert(page().querySelectorAll("#lightbox p").length === 0, "Image enlargement contains unexpected copy");
          assert(page().querySelector("#lightbox img").getAttribute("src").endsWith(".webp"), "Image enlargement is not using the optimized image");
          page().querySelector(".lightbox-close").click();

          await setRoute("#/products?section=aqua", "[data-product-section]");
          assert(page().querySelectorAll("[data-product-section]").length === 4, "Product category buttons are incomplete");
          assert([...page().querySelectorAll("[data-product-section]")].every((button) => button.tagName === "BUTTON"), "Product category control is not a button");
          assert(!page().querySelector("#main-content").innerText.includes("404"), "Product category route returned 404");

          await setRoute("#/contact", ".contact-details");
          assert(page().querySelectorAll(".contact-details").length === 2, "Contact cards are incomplete");
          assert(!page().body.textContent.includes("廈門") && !page().body.textContent.includes("Xiamen"), "Cancelled Xiamen location is still visible");
          assert(new URL(page().querySelector(".map-section iframe").src).hostname === "www.openstreetmap.org", "Map embed URL is not using the allowed host");
          assert(page().querySelector('input[name="website"]'), "Form bot trap is missing");
          assert([...page().querySelectorAll('.inquiry-form input:not([name="website"]), .inquiry-form textarea')].every((field) => field.maxLength > 0), "Contact field limits are missing");

          page().querySelector('[data-language="th"]').click();
          await setRoute("#/news/21", ".article-body");
          assert(/[\u0E00-\u0E7F]/.test(page().querySelector("h1").textContent), "Thai historical news title is missing");
          assert(page().documentElement.scrollWidth <= 390, "Article page has horizontal overflow");
          assert(page().querySelector(".visitor-counter"), "Visitor counter is missing");

          view().sessionStorage.removeItem("hls-welcome-seen");
          frame.dataset.running = "welcome";
          view().location.href = "/#/home";
          await new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
          await waitFor(() => page().querySelector("#welcome-overlay") && !page().querySelector("#welcome-overlay").hidden, "Welcome foreground did not open");
          page().querySelector("#welcome-overlay").click();
          await waitFor(() => page().querySelector("#welcome-overlay").hidden, "Welcome foreground did not close from its background");

          result.dataset.status = "pass";
          result.textContent = "PASS";
        } catch (error) {
          result.dataset.status = "fail";
          result.textContent = `FAIL: ${error.stack || error}`;
        }
      });
    </script>
  </body>
</html>
